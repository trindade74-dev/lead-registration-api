<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Cadastro Realizado</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
                background: #0d1117;
                color: #e6edf3;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                gap: 20px;
            }

            .card {
                background: #161b22;
                border: 1px solid #30363d;
                border-radius: 6px;
                padding: 32px 24px;
                width: 100%;
                max-width: 340px;
                text-align: center;
            }

            .icone {
                font-size: 48px;
                margin-bottom: 16px;
            }

            h1 {
                font-size: 20px;
                font-weight: 300;
                color: #e6edf3;
                margin-bottom: 12px;
            }

            p {
                font-size: 14px;
                color: #8b949e;
                line-height: 1.6;
            }
            p + p {
                margin-top: 8px;
            }

            .btn {
                display: inline-block;
                margin-top: 24px;
                padding: 5px 16px;
                background: #238636;
                color: #ffffff;
                font-size: 14px;
                font-weight: 500;
                border: 1px solid rgba(240, 246, 252, 0.1);
                border-radius: 6px;
                cursor: pointer;
                height: 32px;
                line-height: 22px;
                text-decoration: none;
                transition: background 0.2s;
            }

            .btn:hover {
                background: #2ea043;
            }
        </style>
    </head>
    <body>
            <div class="icone">✅</div>
            <h1>Cadastro Realizado!</h1>
            <p>Obrigado por se cadastrar. Seus dados foram recebidos com sucesso.</p>
            <p> Abra seu email para conferir a aplicação.</p>
            <a class="botao" href="cadastro.html">Voltar ao início</a>
        </div>

    </body>
</html>

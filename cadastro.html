<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale= 1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Cadastro online</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
                background: #0d1117;
                color: #e6edf3;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                gap: 20px;
            }

            .logo {
                font-size: 48px;
                /* Intentionally left minimal for logo styling */
            }

            .card {
                background: #161b22;
                border: 1px solid #30363d;
                border-radius: 6px;
                padding: 24px;
                width: 100%;
                max-width: 340px;
            }

            h1 {
                font-size: 20px;
                font-weight: 300;
                color: #e6edf3;
                text-align: center;
                margin-bottom: 20px;
            }

            label {
                display: block;
                font-size: 13px;
                font-weight: 600;
                color: #e6edf3;
                margin-bottom: 6px;
            }

            input {
                width: 100%;
                padding: 5px 12px;
                background: #0d1117;
                border: 1px solid #30363d;
                border-radius: 6px;
                font-size: 14px;
                color: #e6edf3;
                outline: none;
                height: 32px;
                margin-bottom: 16px;
                transition: border 0.2s, box-shadow 0.2s;
            }

            input:focus {
                border-color: #388bfd;
                box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.3);
            }

            input::placeholder {
                color: #484f58;
            }

            button {
                width: 100%;
                padding: 5px 16px;
                background: #238636;
                color: #ffffff;
                font-size: 14px;
                font-weight: 500;
                border: 1px solid rgba(240, 246, 252, 0.1);
                border-radius: 6px;
                cursor: pointer;
                height: 32px;
                transition: background 0.2s;
            }

            button:hover {
                background: #2ea043;
            }

            .footer {
                border: 1px solid #30363d;
                border-radius: 6px;
                padding: 16px;
                width: 100%;
                max-width: 340px;
                text-align: center;
                font-size: 13px;
                color: #e6edf3;
            }

            .footer a {
                color: #388bfd;
                text-decoration: none;
            }

            .footer a:hover {
                text-decoration: underline;
            }
        </style>
    </head>

    <body>

        <div class="logo">🐙</div>

        <div class="card">
            <h1>Faça seu cadastro</h1>
            <form id="form">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>

                <label for="numero">Número</label>
                <input type="text" id="numero" name="numero" placeholder="(11) 99999-9999" required>

                <button type="submit">Cadastrar</button>
            </form>
        </div>

        <script>
            document.getElementById("form").addEventListener("submit", async function(e) {
                e.preventDefault();
                const dados = {
                    nome: document.getElementById("nome").value,
                    email: document.getElementById("email").value,
                    numero: document.getElementById("numero").value
                };
                await fetch("http://localhost:1234/cadastro", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(dados)
                });
                window.location.href = "cadastro_realizado.html";
            });
        </script>

    </body>
</html>
